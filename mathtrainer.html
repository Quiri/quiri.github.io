<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathe Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* Topic Tabs */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .tab {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab:hover { border-color: #38bdf8; color: #38bdf8; }
    .tab.active { border-color: #38bdf8; background: #0ea5e920; color: #38bdf8; }

    /* Card */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.25rem;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .difficulty-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .difficulty-label { font-size: 0.8rem; color: #64748b; margin-right: 0.25rem; }

    .diff-btn {
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      border: 1.5px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .diff-btn.active-easy  { border-color: #4ade80; color: #4ade80; background: #4ade8010; }
    .diff-btn.active-medium{ border-color: #facc15; color: #facc15; background: #facc1510; }
    .diff-btn.active-hard  { border-color: #f87171; color: #f87171; background: #f8717110; }

    .question-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }

    .question {
      font-size: 1.7rem;
      font-weight: 700;
      color: #f1f5f9;
      min-height: 3rem;
      margin-bottom: 1.5rem;
      line-height: 1.3;
    }

    .hint {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 1.2rem;
      font-style: italic;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: #38bdf8; }
    input[type="text"].correct { border-color: #4ade80; }
    input[type="text"].wrong   { border-color: #f87171; }

    .btn {
      padding: 0.75rem 1.4rem;
      border-radius: 0.75rem;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-check {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0f172a;
    }

    .btn-check:hover { opacity: 0.88; transform: translateY(-1px); }

    .feedback {
      min-height: 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .feedback.correct { color: #4ade80; }
    .feedback.wrong   { color: #f87171; }

    .btn-next {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      color: #94a3b8;
      padding: 0.65rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-next:hover { border-color: #818cf8; color: #818cf8; }

    /* Score Bar */
    .score-bar {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
    }

    .score-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .score-num { font-size: 1.5rem; font-weight: 800; }
    .score-num.green { color: #4ade80; }
    .score-num.red   { color: #f87171; }
    .score-num.blue  { color: #38bdf8; }
    .score-lbl { color: #64748b; font-size: 0.75rem; text-transform: uppercase; }

    /* Progress dots */
    .progress-dots {
      display: flex;
      gap: 0.4rem;
      margin-top: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #334155;
    }

    .dot.c { background: #4ade80; }
    .dot.w { background: #f87171; }

    footer {
      margin-top: 2.5rem;
      color: #334155;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

<h1>Mathe Trainer</h1>
<p class="subtitle">Übe die vier wichtigsten Themen – Aufgaben werden zufällig generiert</p>

<div class="tabs" id="tabs">
  <button class="tab active" data-topic="bruch">Bruchrechnen</button>
  <button class="tab" data-topic="negativ">Negative Zahlen</button>
  <button class="tab" data-topic="ausklammern">Ausklammern</button>
  <button class="tab" data-topic="gleichung">Gleichungen (x)</button>
</div>

<div class="card">
  <div class="difficulty-row">
    <span class="difficulty-label">Schwierigkeit:</span>
    <button class="diff-btn active-easy" data-diff="easy">Leicht</button>
    <button class="diff-btn" data-diff="medium">Mittel</button>
    <button class="diff-btn" data-diff="hard">Schwer</button>
  </div>

  <div class="question-label">Aufgabe</div>
  <div class="question" id="question">Wird geladen…</div>
  <div class="hint" id="hint"></div>

  <div class="input-row">
    <input type="text" id="answer" placeholder="Deine Antwort…" autocomplete="off" />
    <button class="btn btn-check" id="checkBtn">Prüfen</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <button class="btn-next" id="nextBtn">Nächste Aufgabe →</button>
</div>

<div class="score-bar">
  <div class="score-item">
    <span class="score-num green" id="scoreCorrect">0</span>
    <span class="score-lbl">Richtig</span>
  </div>
  <div class="score-item">
    <span class="score-num red" id="scoreWrong">0</span>
    <span class="score-lbl">Falsch</span>
  </div>
  <div class="score-item">
    <span class="score-num blue" id="scoreTotal">0</span>
    <span class="score-lbl">Gesamt</span>
  </div>
</div>

<div class="progress-dots" id="progressDots"></div>

<footer>Alle Aufgaben werden zufällig generiert · © 2026 Mathe Trainer</footer>

<script>
// ─── Utilities ────────────────────────────────────────────────────────────────

function rnd(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { [a, b] = [b, a % b]; }
  return a;
}

function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

function simplifyFraction(num, den) {
  if (den === 0) return { num: 0, den: 1 };
  const g = gcd(Math.abs(num), Math.abs(den));
  let n = num / g, d = den / g;
  if (d < 0) { n = -n; d = -d; }
  return { num: n, den: d };
}

function fractionStr(num, den) {
  const s = simplifyFraction(num, den);
  if (s.den === 1) return String(s.num);
  return `${s.num}/${s.den}`;
}

// Parse user input as fraction "a/b" or integer, returns { num, den } or null
function parseAnswer(str) {
  str = str.trim().replace(/\s/g, '');
  if (/^-?\d+\/\d+$/.test(str)) {
    const parts = str.split('/');
    return { num: parseInt(parts[0]), den: parseInt(parts[1]) };
  }
  if (/^-?\d+$/.test(str)) {
    return { num: parseInt(str), den: 1 };
  }
  return null;
}

function fractionsEqual(a, b) {
  // cross-multiply
  return a.num * b.den === b.num * a.den;
}

// ─── Topic Generators ─────────────────────────────────────────────────────────

const generators = {

  // ── Bruchrechnen ─────────────────────────────────────────────────────────
  bruch(diff) {
    const ops = ['+', '-', '×', '÷'];
    let op, a1, a2, b1, b2, qNum, qDen;

    const maxDen = diff === 'easy' ? 6 : diff === 'medium' ? 12 : 20;
    const maxNum = diff === 'easy' ? 5 : diff === 'medium' ? 10 : 15;

    op = ops[rnd(0, diff === 'easy' ? 1 : 3)];
    a1 = rnd(1, maxNum);
    b1 = rnd(2, maxDen);
    a2 = rnd(1, maxNum);
    b2 = rnd(2, maxDen);

    // ensure b2 ≠ b1 for addition/subtraction variety
    if ((op === '+' || op === '-') && b2 === b1) b2 = b1 + 1;

    let ansNum, ansDen;

    if (op === '+') {
      const l = lcm(b1, b2);
      ansNum = a1 * (l / b1) + a2 * (l / b2);
      ansDen = l;
    } else if (op === '-') {
      const l = lcm(b1, b2);
      ansNum = a1 * (l / b1) - a2 * (l / b2);
      ansDen = l;
    } else if (op === '×') {
      ansNum = a1 * a2;
      ansDen = b1 * b2;
    } else { // ÷
      ansNum = a1 * b2;
      ansDen = b1 * a2;
    }

    const simplified = simplifyFraction(ansNum, ansDen);
    const answerStr = fractionStr(ansNum, ansDen);

    return {
      question: `${a1}/${b1}  ${op}  ${a2}/${b2}  =  ?`,
      hint: 'Kürze dein Ergebnis so weit wie möglich. Format: Zähler/Nenner oder ganze Zahl',
      checkAnswer(input) {
        const parsed = parseAnswer(input);
        if (!parsed) return false;
        return fractionsEqual(parsed, simplified);
      },
      solutionStr: answerStr
    };
  },

  // ── Negative Zahlen ───────────────────────────────────────────────────────
  negativ(diff) {
    const range = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 50;
    const ops = diff === 'easy' ? ['+', '-'] : ['+', '-', '×', '÷'];
    const op = ops[rnd(0, ops.length - 1)];

    let a, b, ans;

    if (op === '+' || op === '-') {
      a = rnd(-range, range);
      b = rnd(-range, range);
      ans = op === '+' ? a + b : a - b;
    } else if (op === '×') {
      a = rnd(-range / 5, range / 5);
      b = rnd(-range / 5, range / 5);
      ans = a * b;
    } else {
      // division: ensure clean result
      b = rnd(1, Math.max(2, range / 5));
      b = Math.random() < 0.5 ? -b : b;
      ans = rnd(-range / 5, range / 5);
      a = ans * b;
    }

    const opSymbol = op === '×' ? '·' : op === '÷' ? ':' : op;

    return {
      question: `${a}  ${opSymbol}  (${b})  =  ?`,
      hint: 'Achte auf Vorzeichen: (−) · (−) = (+)',
      checkAnswer(input) {
        const v = parseInt(input.trim());
        return !isNaN(v) && v === ans;
      },
      solutionStr: String(ans)
    };
  },

  // ── Ausklammern ───────────────────────────────────────────────────────────
  ausklammern(diff) {
    // Generate: a·x + a·b = a(x + b)  or more complex
    const maxA = diff === 'easy' ? 5 : diff === 'medium' ? 10 : 15;
    const maxB = diff === 'easy' ? 8 : diff === 'medium' ? 15 : 20;

    const a = rnd(2, maxA);
    const b = rnd(1, maxB);
    const c = rnd(1, maxB);

    // Three sub-modes
    const mode = rnd(0, diff === 'easy' ? 0 : 2);

    let question, hint, correct;

    if (mode === 0) {
      // a·b + a·c → a(b + c)
      const term1 = a * b;
      const term2 = a * c;
      question = `${term1}x + ${term2}  =  ?`;
      hint = `Finde den größten gemeinsamen Teiler. Format: z.B. 3(2x + 5)`;

      // Accept variants: a(bx + c) or a·(bx + c)
      const g = gcd(term1, term2);
      const f1 = term1 / g;
      const f2 = term2 / g;
      correct = `${g}(${f1}x + ${f2})`;

      return {
        question,
        hint,
        checkAnswer(input) {
          const s = input.trim().replace(/\s/g, '').replace(/·|\*/g, '');
          // Accept any factoring that matches a valid factored form
          // Parse k(mx + n)
          const m = s.match(/^(\d+)\((\d+)x\+(\d+)\)$/);
          if (!m) return false;
          const k = parseInt(m[1]), mx = parseInt(m[2]), n = parseInt(m[3]);
          return k * mx === term1 && k * n === term2;
        },
        solutionStr: correct
      };
    } else if (mode === 1) {
      // a·b·x + a·c·x² → ax(b + cx)
      const term1 = a * b;
      const term2 = a * c;
      question = `${term1}x + ${term2}x²  =  ?`;
      hint = 'Klammere x und den ggT aus. Format: z.B. 4x(3 + 2x)';
      const g = gcd(term1, term2);
      const f1 = term1 / g;
      const f2 = term2 / g;
      correct = `${g}x(${f1} + ${f2}x)`;

      return {
        question,
        hint,
        checkAnswer(input) {
          const s = input.trim().replace(/\s/g, '').replace(/·|\*/g, '');
          const m = s.match(/^(\d+)x\((\d+)\+(\d+)x\)$/);
          if (!m) return false;
          const k = parseInt(m[1]), f = parseInt(m[2]), h = parseInt(m[3]);
          return k * f === term1 && k * h === term2;
        },
        solutionStr: correct
      };
    } else {
      // a(x + b) + a(x + c) = 2a(x + (b+c)/2)  — or just expand ask to factor
      const d = rnd(2, maxA);
      const term1 = a * b + d * b; // (a+d)b
      const term2 = a * c + d * c; // (a+d)c
      const sum = a + d;
      const g = gcd(Math.abs(term1), Math.abs(term2));
      const f1 = term1 / g;
      const f2 = term2 / g;
      question = `${term1}x + ${term2}  =  ?`;
      hint = 'Klammere den ggT aus. Format: z.B. 6(3x + 2)';
      correct = `${g}(${f1}x + ${f2})`;

      return {
        question,
        hint,
        checkAnswer(input) {
          const s = input.trim().replace(/\s/g, '').replace(/·|\*/g, '');
          const m = s.match(/^(\d+)\((\d+)x\+(\d+)\)$/);
          if (!m) return false;
          const k = parseInt(m[1]), mx = parseInt(m[2]), n = parseInt(m[3]);
          return k * mx === term1 && k * n === term2;
        },
        solutionStr: correct
      };
    }
  },

  // ── Einfache Gleichungen ───────────────────────────────────────────────────
  gleichung(diff) {
    const range = diff === 'easy' ? 10 : diff === 'medium' ? 20 : 40;

    // x = solution (always integer for clean answers)
    const x = rnd(-range / 2, range / 2);

    const mode = rnd(0, diff === 'easy' ? 1 : 3);
    let question, checkAnswer, solutionStr;

    if (mode === 0) {
      // ax + b = c
      const a = rnd(1, diff === 'easy' ? 5 : 10);
      const b = rnd(-range, range);
      const c = a * x + b;
      const bStr = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
      question = `${a}x ${bStr}  =  ${c}`;
      hint: '';
      checkAnswer = (input) => parseInt(input.trim()) === x;
      solutionStr = String(x);

    } else if (mode === 1) {
      // ax = b
      const a = rnd(2, diff === 'easy' ? 8 : 15);
      const b = a * x;
      question = `${a}x  =  ${b}`;
      checkAnswer = (input) => parseInt(input.trim()) === x;
      solutionStr = String(x);

    } else if (mode === 2) {
      // ax + b = cx + d  (two sides)
      const a = rnd(2, 8), c = rnd(1, a - 1);
      const b = rnd(-range, range);
      const d = (a - c) * x + b;
      const bStr = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
      const dStr = d >= 0 ? `+ ${d}` : `- ${Math.abs(d)}`;
      question = `${a}x ${bStr}  =  ${c}x ${dStr}`;
      checkAnswer = (input) => parseInt(input.trim()) === x;
      solutionStr = String(x);

    } else {
      // (x + a) / b = c
      const b = rnd(2, 8);
      const a = rnd(-range / 2, range / 2);
      const c = (x + a);
      // question: (x + a) / b = c/b — only if c divisible by b; else adjust
      const realC = c / b;
      if (!Number.isInteger(realC)) {
        // fallback
        const a2 = rnd(1, 5);
        const b2 = a2 * x + rnd(-10, 10);
        question = `${a2}x  =  ${b2}`;
        const sol = b2 / a2;
        if (!Number.isInteger(sol)) {
          checkAnswer = (input) => {
            const p = parseAnswer(input);
            if (!p) return false;
            return fractionsEqual(p, simplifyFraction(b2, a2));
          };
          solutionStr = fractionStr(b2, a2);
        } else {
          checkAnswer = (input) => parseInt(input.trim()) === sol;
          solutionStr = String(sol);
        }
      } else {
        const aStr = a >= 0 ? `+ ${a}` : `- ${Math.abs(a)}`;
        question = `(x ${aStr}) / ${b}  =  ${realC}`;
        checkAnswer = (input) => parseInt(input.trim()) === x;
        solutionStr = String(x);
      }
    }

    return {
      question,
      hint: 'Löse nach x auf. Gib nur die Zahl ein.',
      checkAnswer,
      solutionStr
    };
  }
};

// ─── State ────────────────────────────────────────────────────────────────────

let currentTopic = 'bruch';
let currentDiff  = 'easy';
let currentTask  = null;
let score        = { correct: 0, wrong: 0, total: 0 };
let history      = []; // 'c' or 'w'
let answered     = false;

// ─── DOM ──────────────────────────────────────────────────────────────────────

const questionEl  = document.getElementById('question');
const hintEl      = document.getElementById('hint');
const answerEl    = document.getElementById('answer');
const feedbackEl  = document.getElementById('feedback');
const checkBtn    = document.getElementById('checkBtn');
const nextBtn     = document.getElementById('nextBtn');
const dotsEl      = document.getElementById('progressDots');

function updateScore() {
  document.getElementById('scoreCorrect').textContent = score.correct;
  document.getElementById('scoreWrong').textContent   = score.wrong;
  document.getElementById('scoreTotal').textContent   = score.total;
}

function updateDots() {
  dotsEl.innerHTML = '';
  history.slice(-30).forEach(r => {
    const d = document.createElement('div');
    d.className = 'dot ' + r;
    dotsEl.appendChild(d);
  });
}

function loadTask() {
  answered = false;
  answerEl.value = '';
  answerEl.className = '';
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  currentTask = generators[currentTopic](currentDiff);
  questionEl.textContent = currentTask.question;
  hintEl.textContent = currentTask.hint || '';
  answerEl.focus();
}

function checkAnswer() {
  if (answered) return;
  const input = answerEl.value;
  if (!input.trim()) return;

  answered = true;
  score.total++;

  if (currentTask.checkAnswer(input)) {
    feedbackEl.textContent = '✓ Richtig!';
    feedbackEl.className = 'feedback correct';
    answerEl.classList.add('correct');
    score.correct++;
    history.push('c');
  } else {
    feedbackEl.textContent = `✗ Falsch. Lösung: ${currentTask.solutionStr}`;
    feedbackEl.className = 'feedback wrong';
    answerEl.classList.add('wrong');
    score.wrong++;
    history.push('w');
  }

  updateScore();
  updateDots();
}

// ─── Events ───────────────────────────────────────────────────────────────────

// Tab clicks
document.getElementById('tabs').addEventListener('click', e => {
  if (e.target.dataset.topic) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    currentTopic = e.target.dataset.topic;
    loadTask();
  }
});

// Difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => {
      b.classList.remove('active-easy', 'active-medium', 'active-hard');
    });
    const diff = btn.dataset.diff;
    btn.classList.add(`active-${diff}`);
    currentDiff = diff;
    loadTask();
  });
});

checkBtn.addEventListener('click', checkAnswer);

answerEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered) checkAnswer();
    else loadTask();
  }
});

nextBtn.addEventListener('click', loadTask);

// ─── Init ─────────────────────────────────────────────────────────────────────
loadTask();
</script>
</body>
</html>
