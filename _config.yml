# Site wide configuration
title: "Opiate for the masses"
subtitle: "Data is our religion."
locale: "en_US"
url: "https://quiri.github.io"
baseurl: ""

# Theme settings
theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "dark" # Available skins: "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Built-in Search
search: true
search_full_content: true

# Jekyll configuration
encoding: "utf-8"
permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..2
  enable_coderay: false

include: [".htaccess"]
exclude:
  - Makefile
  - "*.Rmd"
  - node_modules
  - vendor

# Site Author
author:
  name: "Kirill Pomogajko"
  avatar: "/images/kirill.jpg"
  bio: "Data is our religion."
  email: "kirill@pomogajko.com"
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/pomogajko"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Quiri"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "single"
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
